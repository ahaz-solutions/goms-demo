services:
  - type: web
    name: goms-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input && (python manage.py seed_data || true)"
    startCommand: "gunicorn goms_backend.wsgi --workers 2 --threads 2 --timeout 60 --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: goms-demo.onrender.com
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_eVk5ilvQZ4ah@ep-wandering-fog-axfvroby-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&options=endpoint%3Dep-wandering-fog-axfvroby-pooler"
      - key: CORS_ALLOWED_ORIGINS
        value: https://goms-demo-pi.vercel.app
      - key: USE_S3
        value: "False"
    healthCheckPath: /api/
